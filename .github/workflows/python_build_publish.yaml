name: Build and publish common-python to PyPI

on:
  push:
    paths:
      - "common_python/**"
      - ".github/workflows/python_build_publish.yaml"
  workflow_dispatch:
    inputs:
      custom_version:
        description: "Optional version override; defaults to pyproject.toml"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    name: Build and publish package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: common_python

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry

      - name: Set custom version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.custom_version != '' }}
        env:
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: poetry version "$CUSTOM_VERSION"

      - name: Validate package configuration
        run: poetry check

      - name: Build package
        run: poetry build --no-interaction

      - name: Publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: poetry publish --no-interaction

[project]
name = "jwf-common-python"
# pip 打包的版本号，每次发布时更新。
version = "1.0.2"
description = "封装了一些常用功能,GitHub: https://github.com/jiangwenfan/common_packages/tree/main"
authors = [{ name = "evans.jiang", email = "evans.jiang@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = ["requests>=2.31.0,<3.0.0"]

[project.optional-dependencies]
# 上游字幕客户端的 Python 版本上限仅约束 youtube extra。
youtube = ["youtube-transcript-api>=1.2.4,<2; python_version < '3.16'"]

[dependency-groups]
dev = [
    "pytest>=7.4.2,<8.0.0",
    "twine>=4.0.2,<5.0.0",
    "setuptools>=68.2.2,<69.0.0",
    "pre-commit>=3.4.0,<4.0.0",
    # 本地开发安装全部服务依赖，测试无需再临时指定 --with。
    "clickhouse-driver>=0.2.6,<0.3",
    "docker>=7,<8",
    "elasticsearch>=8,<9",
    "Flask>=3,<4",
    "kafka-python>=2.0.2,<3",
    "numpy>=1.26,<3",
    "openai>=1.50.2,<3",
    "pandas>=2.1,<3",
    "pika>=1.3.2,<2",
    "Pillow>=10,<13",
    "pydantic>=2,<3",
    "PyMuPDF>=1.24,<2",
    "PyMySQL>=1.1,<2",
    "python-dotenv>=1,<2",
    "SQLAlchemy>=2,<3",
    "tencentcloud-sdk-python-common>=3.0.1042,<4",
    "tencentcloud-sdk-python-sms>=3.0.1042,<4",
    "youtube-transcript-api>=1.2.4,<2; python_version < '3.16'",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# 包目录位于仓库根目录，而非默认的 src/。
module-root = ""

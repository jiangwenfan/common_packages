[tool.poetry]
name = "jwf-common-python"
# pip打包的版本号,每次都需要更新
version = "1.0.1"
description = "封装了一些常用功能,GitHub: https://github.com/jiangwenfan/common_packages/tree/main"
authors = ["evans.jiang <evans.jiang@gmail.com>"]
license = "MIT"
readme = "README.md"
# 自动打包子目录
packages = [{ include = "jwf_common_python" }]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.31.0"
# 上游字幕客户端的 Python 版本上限仅约束 youtube extra。
youtube-transcript-api = { version = ">=1.2.4,<2", python = ">=3.11,<3.16", optional = true }
# 使用时,安需要安装
# pika = "^1.3.2"
# tencentcloud-sdk-python-tmt = "^3.0.1042"
# kafka-python = "^2.0.2"
# clickhouse-driver = "^0.2.6"
# numpy = "^1.26.2"
# pandas = "^2.1.3"
# sqlalchemy = "^2.0.23"
# pymysql = "^1.1.0"
# azure-cognitiveservices-speech = "^1.33.0"
# black = "^24.8.0"
# isort = "^5.13.2"
# openai = "^1.50.2"
# srt = "^3.5.3"
# tencentcloud-sdk-python-common = "^3.0.1372"


[tool.poetry.extras]
youtube = ["youtube-transcript-api"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
twine = "^4.0.2"
setuptools = "^68.2.2"
pre-commit = "^3.4.0"


[build-system]
requires = ["poetry-core>=1.1.0"]
build-backend = "poetry.core.masonry.api"
